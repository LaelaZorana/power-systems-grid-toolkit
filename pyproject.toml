[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "power-systems-grid-toolkit"
version = "0.2.0"
description = "Power systems analysis toolkit with renewables integration"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Laela Zorana", email = "zoranalaela9@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/LaelaZorana/power-systems-grid-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
